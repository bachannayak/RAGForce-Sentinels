<template>
    <div class="container">
        <lightning-button 
            variant="brand" 
            label="Start Interview" 
            onclick={openModal}
            disabled={isInterviewButtonDisabled}
            title={interviewButtonTitle}>
        </lightning-button>

        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open fullscreen-modal">
                <div class="slds-modal__container modal-container">
                    <!-- Modal Header -->
                    <header class="slds-modal__header">
                        <div class="header-content">
                            <lightning-button-icon
                                icon-name="utility:close"
                                variant="bare"
                                size="large"
                                class="slds-modal__close"
                                onclick={closeModal}
                                alternative-text="Close">
                            </lightning-button-icon>
                            <h2 class="slds-text-heading_medium">Interview Agent</h2>
                        </div>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content modal-content">
                        <div class="modal-main-area">
                            <div class="video-area">
                                <video autoplay playsinline class="video-stream" lwc:dom="manual"></video>
                                <div class="button-container">
                                    <lightning-button 
                                        variant="brand"
                                        label={toggleButtonLabel}
                                        onclick={toggleVideo}
                                        class="control-button">
                                    </lightning-button>
                                    <lightning-button 
                                        variant="brand"
                                        label="Send to Agent"
                                        onclick={toggleRecording}
                                        class="control-button">
                                    </lightning-button>
                                    <lightning-combobox
                                        name="language"
                                        label="Select Language"
                                        value={selectedLanguage}
                                        options={availableLanguages}
                                        onchange={handleLanguageChange}
                                        class="language-dropdown">
                                    </lightning-combobox>
                                </div>
                            </div>
                            <div class="chat-area">
                                <div class="transcript-container">
                                    <template if:true={transcript}>
                                        <div class="chat-bubble user-bubble">
                                            <strong>User:</strong> {transcript}
                                        </div>
                                    </template>
                                    <template if:true={agentResponse}>
                                        <div class="chat-bubble agent-bubble">
                                            <strong>Agent:</strong> {agentResponse}
                                        </div>
                                    </template>
                                    <template if:true={agentTranslatedResponse}>
                                        <div class="chat-bubble agent-translated-bubble">
                                            <strong>Agent (translated):</strong> {agentTranslatedResponse}
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button 
                            variant="neutral"
                            label="Close"
                            onclick={closeModal}
                            class="footer-button">
                        </lightning-button>
                    </footer>
                </div>
            </section>

        </template>
    </div>
</template>
